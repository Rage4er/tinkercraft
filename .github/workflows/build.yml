name: Test package
on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web-app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web-app
        run: pnpm install

      - name: Type check
        working-directory: web-app
        run: pnpm typecheck

      - name: Run tests
        working-directory: web-app
        run: pnpm test
