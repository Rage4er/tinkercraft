name: CI (web-app)

on:
  push:
    branches: ['**']
    paths:
      - 'web-app/**'
      - '.github/workflows/ci-web.yml'
  pull_request:
    branches: ['**']
    paths:
      - 'web-app/**'
      - '.github/workflows/ci-web.yml'

defaults:
  run:
    working-directory: web-app

jobs:
  ci:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: web-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # COOP/COEP заголовки требуют cross-origin isolation
          # vite build не зависит от них, но оставляем для консистентности
          CI: true
